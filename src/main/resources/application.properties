spring.application.name=recettes
# Le diaporama indique 8081 ; l'énoncé Word indique 8080.
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/recettesdb}
spring.datasource.username=${DB_USERNAME:recettesuser}
spring.datasource.password=${DB_PASSWORD:recettespass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
